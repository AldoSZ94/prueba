{% extends "tareas/base.html" %}
{% block title %}Eliminar tarea{% endblock %}
{% block content %}
    <div class="flex grow items-center justify-center">
        <main class="mx-auto w-9/10 max-w-120">
            <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
                <!-- Encabezado -->
                <div class="mb-6 text-center">
                    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-red-50">
                        <svg xmlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke-width="1.8"
                             stroke="currentColor"
                             class="h-6 w-6 text-red-500">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376
                               c-.866 1.5.216 3.374 1.949 3.374h14.708
                               c1.733 0 2.815-1.874 1.949-3.374
                               L13.949 4.126c-.866-1.5-3.032-1.5-3.898 0
                               L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
                        </svg>
                    </div>
                    <h1 class="text-xl font-semibold text-slate-800">¿Eliminar esta tarea?</h1>
                    <p class="mt-2 text-sm text-slate-500">Esta acción no se puede deshacer.</p>
                </div>
                <!-- Información de la tarea -->
                <div class="mb-6 rounded-lg border border-slate-200 bg-slate-50 p-4">
                    <p class="text-sm font-medium text-slate-700">{{ tarea.titulo }}</p>
                    {% if tarea.descripcion %}
                        <p class="mt-1 text-sm text-slate-500">{{ tarea.descripcion }}</p>
                    {% endif %}
                </div>
                <!-- Acciones -->
                <form method="post" class="flex gap-3">
                    {% csrf_token %}
                    <a href="{% url 'tareas:lista_tareas' %}"
                       class="flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-center text-sm font-medium text-slate-600 transition hover:bg-slate-50 focus:ring-2 focus:ring-slate-400 focus:outline-none">
                        Cancelar
                    </a>
                    <button type="submit"
                            class="flex-1 cursor-pointer rounded-lg bg-red-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-red-700 focus:ring-2 focus:ring-red-300 focus:outline-none">
                        Eliminar
                    </button>
                </form>
            </div>
        </main>
    </div>
{% endblock %}
